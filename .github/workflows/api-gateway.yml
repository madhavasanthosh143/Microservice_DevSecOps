name: api-gateway

on:
  push:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/api-gateway.yml'
      - '.github/workflows/ci-cd-service.yml'
      - 'k8s/base/api-gateway/**'
      - 'k8s/overlays/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/api-gateway.yml'
      - '.github/workflows/ci-cd-service.yml'
  workflow_dispatch: {}

jobs:
  ci-cd:
    uses: ./.github/workflows/ci-cd-service.yml
    with:
      service-name: api-gateway
      service-path: services/api-gateway
      environment: dev
      ecr-repository: msdemo/api-gateway
      eks-cluster-name: msdemo-dev
      # Scan/build gates always run; only push-to-main actually deploys.
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
