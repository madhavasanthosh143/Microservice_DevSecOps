name: Reusable service CI/CD

# Called by one thin workflow per microservice (see .github/workflows/<service>.yml).
# Centralizing the pipeline here means every service gets the same DevSecOps
# gates and nobody can quietly skip a stage in their own copy-pasted YAML.
#
# Stage order: secret scan -> SAST -> build/test -> SCA (dependency scan) ->
# container build -> image scan -> SBOM -> sign -> push -> policy gate on
# rendered k8s manifests -> deploy. Each scanning stage fails the job on
# HIGH/CRITICAL findings; see security/ for the tool configs and how to
# record an accepted-risk exception instead of silently loosening a gate.

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        description: "Path to the service's source + Dockerfile, e.g. services/auth-service"
        required: true
        type: string
      environment:
        description: "dev or prod — selects the k8s/overlays/<environment> overlay and GitHub Environment protection rules"
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "us-east-1"
      ecr-repository:
        description: "Full ECR repo name, e.g. msdemo/auth-service"
        required: true
        type: string
      eks-cluster-name:
        required: true
        type: string
      build-command:
        description: "Override if the service isn't a Maven/Spring Boot build"
        required: false
        type: string
        default: "mvn -B -f ${{ inputs.service-path }}/pom.xml verify"
      deploy:
        description: "Set false to run all scan/build gates without deploying (e.g. for PRs)"
        required: false
        type: boolean
        default: true
    secrets:
      # Keep this a plain repository secret, not an Environment-scoped one:
      # the caller job that forwards it (see .github/workflows/<service>.yml)
      # doesn't itself declare `environment:`, so an Environment secret
      # wouldn't resolve there. Approval gating for prod still comes from
      # the `environment: prod` set on the build-image/deploy jobs below —
      # add required reviewers to that Environment in repo settings.
      AWS_ROLE_ARN:
        required: true

permissions:
  contents: read
  id-token: write      # required for OIDC -> AWS role assumption and cosign keyless signing
  security-events: write # required to upload SARIF to code scanning
  pull-requests: write   # required to comment scan summaries on PRs

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: security/gitleaks/gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/ci --config p/owasp-top-ten --config p/secrets \
            --sarif --output semgrep.sarif \
            --error \
            "${{ inputs.service-path }}"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  build-and-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    needs: [secret-scan, sast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: ${{ inputs.build-command }}

  dependency-scan:
    name: SCA (Trivy filesystem scan)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service-path }}
          trivy-config: security/trivy/trivy.yaml
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  build-image:
    name: Build, scan, sign & push image
    runs-on: ubuntu-latest
    needs: dependency-scan
    environment: ${{ inputs.environment }}
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ steps.image-ref.outputs.ref }}
      image-digest-ref: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image ref
        id: image-ref
        run: |
          echo "ref=${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service-path }}
          push: false
          load: true
          tags: ${{ steps.image-ref.outputs.ref }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.image-ref.outputs.ref }}
          trivy-config: security/trivy/trivy.yaml
          format: sarif
          output: trivy-image.sarif
      - name: Upload image scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image-ref.outputs.ref }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service-name }}-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Push image to ECR
        id: push
        run: |
          docker push "${{ steps.image-ref.outputs.ref }}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.image-ref.outputs.ref }}" | cut -d'@' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, via GitHub OIDC)
        run: |
          cosign sign --yes "${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}@${{ steps.push.outputs.digest }}"

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            "${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}@${{ steps.push.outputs.digest }}"

  policy-gate:
    name: Policy check rendered manifests (Conftest/OPA)
    runs-on: ubuntu-latest
    needs: build-image
    env:
      CONFTEST_VERSION: "0.55.0"
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Install conftest
        run: |
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo mv conftest /usr/local/bin/
      - name: Render manifests
        run: kustomize build k8s/overlays/${{ inputs.environment }} > rendered.yaml
      - name: Run Conftest
        run: conftest test --policy security/opa-policies rendered.yaml

  deploy:
    name: Deploy to EKS (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [build-image, policy-gate]
    if: inputs.deploy
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ inputs.aws-region }} --name ${{ inputs.eks-cluster-name }}

      - name: Set image and apply
        working-directory: k8s/overlays/${{ inputs.environment }}
        run: |
          # Deploy by digest, not tag — matches exactly what was scanned and signed above.
          kustomize edit set image ${{ inputs.service-name }}:local=${{ needs.build-image.outputs.image-digest-ref }}
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl -n microservices rollout status deployment/${{ inputs.service-name }} --timeout=180s
