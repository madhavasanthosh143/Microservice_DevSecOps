name: full-repo-secret-scan

# The per-service pipelines only scan their own service-path on each change.
# This runs a full-history, whole-repo sweep on a schedule to catch anything
# that slipped in via an unrelated path or an old commit.

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: security/gitleaks/gitleaks.toml
