apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: microservices
  annotations:
    # eks.amazonaws.com/role-arn is set per-environment by the overlay
    # (matches the IRSA role Terraform creates for this service).
    eks.amazonaws.com/role-arn: "REPLACE_WITH_IRSA_ROLE_ARN"
automountServiceAccountToken: true
