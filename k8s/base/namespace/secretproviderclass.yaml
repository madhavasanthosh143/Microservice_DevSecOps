# Requires the AWS Secrets Store CSI Driver + provider installed on the cluster:
#   helm install csi-secrets-store secrets-store-csi-driver-provider-aws/secrets-store-csi-driver-provider-aws
# The referenced secret ("microservices-demo/dev/jwt-secret") must exist in AWS
# Secrets Manager with a JSON body: {"JWT_SECRET": "<value>"}. No plaintext
# secret material is ever stored in this repo.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shared-secrets
  namespace: microservices
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "microservices-demo/dev/jwt-secret"
        objectType: "secretsmanager"
        jmesPath:
          - path: "JWT_SECRET"
            objectAlias: "JWT_SECRET"
  secretObjects:
    - secretName: shared-jwt-secret
      type: Opaque
      data:
        - objectName: JWT_SECRET
          key: JWT_SECRET
